name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential curl unzip

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Prepare the build toolchain
        shell: bash
        run: |
          set -euo pipefail
          PRIV="$HOME/stremiobrew-build"
          mkdir -p "$PRIV/android" "$PRIV/src"
          ln -sfn "$ANDROID_HOME" "$PRIV/android/sdk"

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.11.1-bin.zip" -d "$PRIV/android"
          test -x "$PRIV/android/gradle-8.11.1/bin/gradle"

          curl -fL --retry 3 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.2/mbedtls-3.6.2.tar.bz2 \
            -o "$PRIV/src/mbedtls-3.6.2.tar.bz2"
          curl -fL --retry 3 \
            https://curl.se/download/curl-8.11.1.tar.xz \
            -o "$PRIV/src/curl-8.11.1.tar.xz"
          curl -fL --retry 3 \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-2.30.12.tar.gz \
            -o "$RUNNER_TEMP/SDL2-2.30.12.tar.gz"
          tar -xzf "$RUNNER_TEMP/SDL2-2.30.12.tar.gz" \
            --strip-components=1 -C "$PRIV/linux/SDL2-2.30.12"

          echo "NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$PRIV/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$PRIV/android/sdk" >> "$GITHUB_ENV"

      - name: Create a temporary Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build native dependencies (arm64-v8a only)
        run: tools/phone/build-deps.sh arm64-v8a

      - name: Build native application (arm64-v8a only)
        run: tools/phone/build.sh arm64-v8a

      - name: Assemble arm64-v8a debug APK
        env:
          TARGET_ABIS: arm64-v8a
        run: tools/phone/apk.sh debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stremio-origin-android-arm64-debug-apk
          path: dist/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
