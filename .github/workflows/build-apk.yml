name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bzip2 build-essential cmake curl git libtool ninja-build \
            pkg-config python3 python3-yaml unzip xz-utils zip

      - name: Install Android SDK and NDK packages
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "Could not find an executable sdkmanager under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "NDK=$ANDROID_HOME/ndk/27.2.12479018"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"

      - name: Prepare the build toolchain
        shell: bash
        run: |
          set -euo pipefail
          PRIV="$HOME/stremiobrew-build"
          mkdir -p "$PRIV/android" "$PRIV/src/SDL2-2.30.12" "$HOME/.android"

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.11.1-bin.zip" -d "$PRIV/android"
          test -x "$PRIV/android/gradle-8.11.1/bin/gradle"

          curl -fL --retry 3 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.2/mbedtls-3.6.2.tar.bz2 \
            -o "$PRIV/src/mbedtls-3.6.2.tar.bz2"
          curl -fL --retry 3 \
            https://curl.se/download/curl-8.11.1.tar.xz \
            -o "$PRIV/src/curl-8.11.1.tar.xz"
          curl -fL --retry 3 \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-2.30.12.tar.gz \
            -o "$RUNNER_TEMP/SDL2-2.30.12.tar.gz"
          tar -xzf "$RUNNER_TEMP/SDL2-2.30.12.tar.gz" \
            --strip-components=1 -C "$PRIV/src/SDL2-2.30.12"

          tar -tjf "$PRIV/src/mbedtls-3.6.2.tar.bz2" >/dev/null
          tar -tJf "$PRIV/src/curl-8.11.1.tar.xz" >/dev/null
          test -f "$PRIV/src/SDL2-2.30.12/CMakeLists.txt"

      - name: Create and verify temporary Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null

      - name: Validate workflow and Android resource metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import yaml

          with open(".github/workflows/build-apk.yml", encoding="utf-8") as stream:
              yaml.safe_load(stream)
          ET.parse("android-phone/app/src/main/AndroidManifest.xml")
          ET.parse("android-phone/app/src/main/res/values/strings.xml")
          print("Workflow YAML and Android XML resources parse successfully")
          PY
          if grep -R -n 'darwin-x86_64' tools/phone tools/build-engine.sh; then
            echo "A macOS NDK host path remains in the Android build scripts" >&2
            exit 1
          fi
          ! grep -q 'android-actions/setup-android' .github/workflows/build-apk.yml

      - name: Validate phone shell scripts
        shell: bash
        run: |
          set -euo pipefail
          find tools tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Build native dependencies (arm64-v8a only)
        shell: bash
        run: |
          set -euo pipefail
          tools/phone/build-deps.sh arm64-v8a

      - name: Build native application (arm64-v8a only)
        shell: bash
        run: |
          set -euo pipefail
          tools/phone/build.sh arm64-v8a

      - name: Build torrent engine (arm64-v8a)
        shell: bash
        env:
          ORIGIN_BUILD: ${{ runner.temp }}/myth-engine-build
          ENGINE_JOBS: '4'
        run: |
          set -euo pipefail
          tools/build-engine.sh android-arm64
          test -s build/phone-arm64-v8a/libsbengine.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/phone-arm64-v8a/libsbengine.so | grep -q "Machine:.*AArch64"

      - name: Assemble arm64-v8a debug APK
        shell: bash
        env:
          TARGET_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          tools/phone/apk.sh debug
          grep -Fx "sdk.dir=$ANDROID_HOME" android-phone/local.properties
          grep -Fx "ndk.dir=$NDK" android-phone/local.properties
          grep -q "ndkVersion '27.2.12479018'" android-phone/app/build.gradle
          grep -q '"sbengine"' android-phone/app/src/main/java/app/stremioorigin/phone/MainActivity.java
          test -s android-phone/app/src/main/jniLibs/arm64-v8a/libsbengine.so
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-phone/app/build.gradle | head -1)"
          test -n "$VERSION"
          APK_PATH="dist/myth-$VERSION-arm64-v8a-debug.apk"
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          python3 - "$APK_PATH" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as apk:
              abis = {
                  path.split("/")[1]
                  for path in apk.namelist()
                  if path.startswith("lib/") and len(path.split("/")) > 2
              }
          required = {
              "lib/arm64-v8a/libmain.so",
              "lib/arm64-v8a/libsbengine.so",
              "lib/arm64-v8a/libSDL2.so",
              "lib/arm64-v8a/libcurl.so",
          }
          missing = required.difference(apk.namelist())
          if missing:
              raise SystemExit(f"APK is missing required native libraries: {sorted(missing)}")
          if abis != {"arm64-v8a"}:
              raise SystemExit(f"Expected only arm64-v8a native libraries, found: {sorted(abis)}")
          print("Verified arm64-v8a ABI and required native libraries:", ", ".join(sorted(required)))
          PY
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myth-android-arm64-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
