name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The native build script currently selects the NDK's darwin-x86_64 toolchain.
    # Rosetta lets that toolchain run on the macOS hosted runner without patching project scripts.
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: |
          softwareupdate --install-rosetta --agree-to-license
          brew install cmake ninja

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Prepare the build toolchain layout
        shell: bash
        run: |
          set -euo pipefail
          PRIV="$HOME/stremiobrew-build"
          mkdir -p "$PRIV/android" "$PRIV/src" "$PRIV/mac"

          # apk.sh expects the SDK and Gradle in these project-specific locations.
          ln -sfn "$ANDROID_HOME" "$PRIV/android/sdk"
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.11.1-bin.zip" -d "$PRIV/android"
          test -x "$PRIV/android/gradle-8.11.1/bin/gradle"

          # build-deps.sh consumes these pinned source archives from its documented private build directory.
          curl -fL --retry 3 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.2/mbedtls-3.6.2.tar.bz2 \
            -o "$PRIV/src/mbedtls-3.6.2.tar.bz2"
          curl -fL --retry 3 \
            https://curl.se/download/curl-8.11.1.tar.xz \
            -o "$PRIV/src/curl-8.11.1.tar.xz"
          curl -fL --retry 3 \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-2.30.12.tar.gz \
            -o "$RUNNER_TEMP/SDL2-2.30.12.tar.gz"
          mkdir -p "$PRIV/mac/SDL2-2.30.12"
          tar -xzf "$RUNNER_TEMP/SDL2-2.30.12.tar.gz" \
            --strip-components=1 -C "$PRIV/mac/SDL2-2.30.12"

          echo "NDK=$PRIV/android/sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$PRIV/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$PRIV/android/sdk" >> "$GITHUB_ENV"

      - name: Create a temporary Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build native dependencies for both ABIs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            tools/phone/build-deps.sh "$abi"
          done

      - name: Build the native application for both ABIs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            tools/phone/build.sh "$abi"
          done

      - name: Assemble debug APKs
        run: tools/phone/apk.sh debug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stremio-origin-android-debug-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
